<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="KNCHS building placeholder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d0a1a"/>
      <stop offset="55%" stop-color="#681a31"/>
      <stop offset="100%" stop-color="#931a3b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#b22347" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7a1935" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d6b263" stop-opacity="0.30"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0v80" fill="none" stroke="#f0e2c0" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- stylised campus silhouette -->
  <g fill="#2c0613" opacity="0.42">
    <rect x="150" y="470" width="300" height="430" rx="6"/>
    <rect x="470" y="380" width="420" height="520" rx="6"/>
    <rect x="910" y="500" width="250" height="400" rx="6"/>
    <rect x="1180" y="440" width="270" height="460" rx="6"/>
  </g>
  <g fill="#f0e2c0" opacity="0.16">
    <rect x="200" y="530" width="200" height="14" rx="4"/>
    <rect x="200" y="580" width="200" height="14" rx="4"/>
    <rect x="520" y="440" width="320" height="16" rx="4"/>
    <rect x="520" y="496" width="320" height="16" rx="4"/>
    <rect x="1220" y="500" width="190" height="14" rx="4"/>
  </g>

  <!-- crest -->
  <g transform="translate(800 250) scale(3.1)" opacity="0.30">
    <path d="M32 3 58 11v22c0 14-11 24.5-26 28C17 57.5 6 47 6 33V11L32 3Z" fill="none" stroke="#f0e2c0" stroke-width="3"/>
  </g>

  <text x="800" y="700" text-anchor="middle" fill="#f0e2c0" fill-opacity="0.62"
        font-family="Georgia, serif" font-size="42" letter-spacing="10">KNCHS</text>
  <text x="800" y="752" text-anchor="middle" fill="#f0e2c0" fill-opacity="0.34"
        font-family="Georgia, serif" font-size="19" letter-spacing="6">Your Space, Your Schedule.</text>
</svg>